name: One-shot debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-debug:
    # The push trigger is deliberately limited to the one commit that installs this workflow.
    # Later pushes do not build automatically; manual dispatch remains available.
    # Keep this workflow opt-in for all subsequent code commits.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Build debug APK'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Continuum
        uses: actions/checkout@v4
        with:
          path: continuumtest

      - name: Check out shipped subreddit lists
        uses: actions/checkout@v4
        with:
          repository: cygnusx-1-org/subreddit-lists
          path: subreddit-lists

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: continuumtest
        run: ./gradlew :app:assembleDebug -PskipDeviceTests=true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: continuum-debug-apk
          path: continuumtest/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
